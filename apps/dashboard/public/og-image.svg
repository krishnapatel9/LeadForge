<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.1" stroke="#cbd5e1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Logo Mark -->
  <rect x="120" y="140" width="80" height="80" rx="20" fill="#4f46e5"/>
  <text x="140" y="196" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">LF</text>

  <!-- Title & Subtitle -->
  <text x="120" y="290" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
    LeadForge
  </text>
  <text x="120" y="350" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">
    B2B Lead Intelligence & Outreach Engine
  </text>
  <text x="120" y="410" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Enrich ICP profiles &bull; Multi-factor deterministic scoring &bull; Claude-crafted personalized outreach
  </text>

  <!-- Metric Badges -->
  <g transform="translate(120, 480)">
    <rect width="200" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="24" y="38" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">100% Deterministic</text>
  </g>
  <g transform="translate(340, 480)">
    <rect width="200" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="38" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Human-in-Loop</text>
  </g>
  <g transform="translate(560, 480)">
    <rect width="220" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="24" y="38" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Anti-Spam Guardrails</text>
  </g>
</svg>
