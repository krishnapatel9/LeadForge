version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: leadforge-db
    restart: always
    environment:
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: leadforge
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: leadforge-dashboard
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_SITE_URL=http://localhost:3001
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    volumes:
      - ./apps/dashboard:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - db

volumes:
  postgres_data:
