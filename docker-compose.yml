services:
  db:
    image: postgres:15-alpine
    container_name: leadforge-db
    restart: always
    environment:
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: leadforge
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applied in filename order the first time the volume is created.
      # For an existing database, run new migrations by hand with psql.
      - ./apps/api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadforge -d leadforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: leadforge-api
    restart: always
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      # Inside the compose network the database is "db" on its default port
      DATABASE_URL: postgresql+asyncpg://leadforge:password123@db:5432/leadforge
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: leadforge-dashboard
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_SITE_URL=http://localhost:3001
      # Called from the browser, so this is the host-side address of the API
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    volumes:
      - ./apps/dashboard:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
